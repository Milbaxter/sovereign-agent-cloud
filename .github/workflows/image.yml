name: Publish tenant runtime
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/milbaxter/sovereign-agent-cloud:sha-${{ github.sha }}
          provenance: true
          sbom: true
      - run: echo 'Pin ghcr.io/milbaxter/sovereign-agent-cloud:sha-${{ github.sha }}@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
